<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>関根商店カレンダー</title>
<style id="pageStyle"></style>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; }
  html, body { height:100%; }
  body { background:#f5f5f4; color:#111827; display:flex; flex-direction:column; }
  button { font-family:inherit; }

  /* ===== ヘッダー(1行・シンプル) ===== */
  header { background:#fff; border-bottom:2px solid #d6d3d1; padding:8px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:18px; color:#44403c; white-space:nowrap; }
  .nav { border:1px solid #d6d3d1; background:#fff; border-radius:10px; width:44px; height:42px; font-size:18px; cursor:pointer; color:#44403c; }
  .title { font-size:26px; font-weight:900; white-space:nowrap; min-width:170px; text-align:center; }
  .tBtn { border:1px solid #d6d3d1; background:#fff; border-radius:10px; padding:9px 14px; font-size:15px; font-weight:bold; cursor:pointer; color:#44403c; white-space:nowrap; }
  .modeSw { display:flex; border:2px solid #0f766e; border-radius:12px; overflow:hidden; }
  .modeSw button { border:none; background:#fff; color:#0f766e; font-size:18px; font-weight:900; padding:8px 22px; cursor:pointer; }
  .modeSw button.on { background:#0f766e; color:#fff; }
  .spacer { flex:1; }
  .backPhone { border:none; background:#1565c0; color:#fff; border-radius:10px; padding:10px 14px; font-size:16px; font-weight:bold; cursor:pointer; white-space:nowrap; }
  .it.isMissed { color:#b45309; }
  .it.isMissed .nm { text-decoration:line-through; }
  .miss { flex-shrink:0; font-size:.6em; font-weight:bold; background:#fef3c7; color:#b45309; border:1px solid #f59e0b; border-radius:4px; padding:0 3px; }
  /* 会社さがし */
  .kana { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
  .kana button { min-width:40px; padding:7px 0; border:1px solid #d6d3d1; background:#fff; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
  .kana button.on { background:#0f766e; color:#fff; border-color:#0f766e; }
  .pickList { max-height:210px; overflow-y:auto; border:1px solid #e7e5e4; border-radius:10px; margin-top:6px; }
  .pickList div { padding:10px 12px; border-bottom:1px solid #f5f5f4; cursor:pointer; font-size:17px; font-weight:bold; }
  .pickList div:hover { background:#f0fdfa; }
  .pickList small { display:block; font-size:12px; color:#78716c; font-weight:normal; }
  .pickList .none2 { color:#a8a29e; font-weight:normal; cursor:default; }
  .cInfo { margin-top:8px; background:#f0fdfa; border:1px solid #99f6e4; border-radius:10px; padding:10px 12px; font-size:15px; line-height:1.7; display:none; }
  .cInfo a { display:inline-block; margin-right:8px; margin-top:4px; background:#fff; border:1px solid #0f766e; color:#0f766e; border-radius:8px; padding:6px 10px; font-weight:bold; text-decoration:none; }
  .stSeg button[data-v="done"].on { background:#16a34a; border-color:#16a34a; }
  .stSeg button[data-v="missed"].on { background:#d97706; border-color:#d97706; }
  .addBtn { border:none; background:#0f766e; color:#fff; border-radius:10px; padding:10px 16px; font-size:16px; font-weight:bold; cursor:pointer; white-space:nowrap; }
  .menuWrap { position:relative; }
  .menu { display:none; position:absolute; right:0; top:48px; background:#fff; border:1px solid #d6d3d1; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.15); z-index:50; min-width:200px; overflow:hidden; }
  .menu.show { display:block; }
  .menu button { display:block; width:100%; text-align:left; border:none; background:#fff; padding:14px 16px; font-size:16px; font-weight:bold; cursor:pointer; border-bottom:1px solid #f5f5f4; }
  .menu button:hover { background:#f5f5f4; }

  main { flex:1; min-height:0; padding:8px; display:flex; flex-direction:column; }

  /* ===== 共通:予定の行(紙のカレンダーのように黒文字・印だけ) ===== */
  .it { display:flex; align-items:baseline; gap:4px; font-weight:800; line-height:1.35; cursor:pointer; white-space:nowrap; overflow:hidden; border-radius:4px; padding:0 2px; }
  .it:hover { background:#f5f5f4; }
  .it .mk { flex-shrink:0; font-size:.8em; }
  .bx { display:inline-block; font-size:.62em; font-weight:bold; border:1.5px solid currentColor; border-radius:3px; padding:0 2px; line-height:1.2; color:#78716c; vertical-align:.12em; }
  .it.urgent .bx { color:#dc2626; }
  .legendMini { font-size:13px; color:#78716c; white-space:nowrap; }
  .it .nm { overflow:hidden; text-overflow:ellipsis; }
  .it.urgent { color:#dc2626; }
  .it.isDone { color:#a8a29e; }
  .it.isDone .nm { text-decoration:line-through; }
  .sec { color:#78716c; font-weight:bold; }

  /* ===== 3日表示 ===== */
  .three { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1.25fr 1fr; border:2px solid #57534e; background:#fff; }
  .day { display:flex; flex-direction:column; min-height:0; border-right:1px solid #a8a29e; }
  .day:last-child { border-right:none; }
  .dHead { display:flex; align-items:baseline; gap:8px; padding:6px 12px; border-bottom:2px solid #57534e; background:#fafaf9; cursor:pointer; }
  .dHead .dn { font-size:40px; font-weight:900; line-height:1; }
  .dHead .dw { font-size:20px; font-weight:bold; }
  .dHead .dh { font-size:14px; font-weight:bold; color:#dc2626; }
  .dHead .cnt { margin-left:auto; font-size:15px; font-weight:bold; color:#57534e; }
  .dHead .mini { border:1px solid #d6d3d1; background:#fff; border-radius:8px; padding:4px 9px; font-size:14px; cursor:pointer; }
  .day.sat .dn, .day.sat .dw { color:#1d4ed8; }
  .day.sun .dn, .day.sun .dw, .day.hol .dn, .day.hol .dw { color:#dc2626; }
  .day.today .dHead { background:#fef9c3; }
  .todayMark { font-size:14px; font-weight:bold; background:#facc15; color:#422006; border-radius:6px; padding:2px 8px; }
  .dBody { flex:1; min-height:0; overflow:hidden; padding:8px 12px; --fs:24px; font-size:var(--fs); }
  .dBody.scroll { overflow-y:auto; }
  .dBody .sec { font-size:calc(var(--fs)*.55); margin:6px 0 2px; border-bottom:1px dashed #d6d3d1; }
  .dBody .sub { font-size:calc(var(--fs)*.55); color:#57534e; font-weight:normal; margin:-2px 0 4px 1.4em; white-space:normal; }
  .none { color:#d6d3d1; font-size:18px; text-align:center; margin-top:24px; }

  /* ===== 1か月表示(紙のカレンダーの形) ===== */
  .mWrap { border:2px solid #57534e; background:#fff; }
  main.scrollMain { overflow-y:auto; display:block; }
  .dow { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:2px solid #57534e; background:#44403c; color:#fff; }
  .dow div { text-align:center; font-weight:900; font-size:16px; padding:3px 0; border-right:1px solid #78716c; }
  .dow div:last-child { border-right:none; }
  .dow .sa { background:#1d4ed8; } .dow .su { background:#dc2626; }
  .mGrid { display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows:minmax(120px,auto); }
  .mc { border-right:1px solid #a8a29e; border-bottom:1px solid #a8a29e; display:flex; flex-direction:column; cursor:pointer; padding:2px 4px 6px; min-width:0; }
  .mc:nth-child(7n) { border-right:none; }
  .mc.other { background:#fafaf9; }
  .mc.other .mn { color:#d6d3d1 !important; }
  .mc.today { background:#fef9c3; }
  .mh { display:flex; align-items:baseline; gap:4px; }
  .mn { font-size:24px; font-weight:900; line-height:1.05; }
  .mc.sat .mn { color:#1d4ed8; }
  .mc.sun .mn, .mc.hol .mn { color:#dc2626; }
  .mhol { font-size:10px; color:#dc2626; font-weight:bold; white-space:nowrap; overflow:hidden; }
  .mcnt { margin-left:auto; font-size:11px; color:#78716c; font-weight:bold; }
  .mb { --fs:14px; font-size:var(--fs); }
  .mb.two { column-count:2; column-gap:4px; }
  .mb .it { line-height:1.25; }
  .mb .sec { display:none; }
  /* ===== モーダル ===== */
  .modalBg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; align-items:center; justify-content:center; padding:14px; }
  .modalBg.show { display:flex; }
  .modal { background:#fff; border-radius:18px; width:100%; max-width:600px; max-height:92vh; overflow-y:auto; padding:18px; }
  .modal h3 { font-size:20px; margin-bottom:6px; }
  label.f { display:block; font-size:14px; font-weight:bold; color:#475569; margin:12px 0 5px; }
  .modal input, .modal select, .modal textarea { width:100%; padding:11px; font-size:17px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1; min-width:74px; padding:10px 6px; font-size:15px; font-weight:bold; border:2px solid #cbd5e1; border-radius:10px; background:#f8fafc; color:#334155; cursor:pointer; }
  .seg button.on { border-color:#0f766e; background:#0f766e; color:#fff; }
  .row2 { display:flex; gap:8px; }
  .row2 > * { flex:1; min-width:0; }
  .itemsGrid { display:grid; grid-template-columns:1fr 80px 28px; gap:8px; align-items:center; }
  .itemsGrid span { font-size:16px; font-weight:bold; }
  .itemsGrid input { text-align:center; }
  .doneBox { display:flex; align-items:center; gap:10px; background:#f0fdf4; border:2px solid #86efac; border-radius:12px; padding:12px; margin-top:14px; font-size:17px; font-weight:bold; color:#166534; cursor:pointer; }
  .doneBox input { width:24px; height:24px; }
  .btnRow { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .btn { flex:1; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; }
  .btn.main { background:#0f766e; color:#fff; }
  .btn.sub { background:#e2e8f0; color:#334155; }
  .btn.del { background:#fee2e2; color:#dc2626; flex:0 0 100%; }
  .btn.blue { background:#2563eb; color:#fff; }
  .hint { font-size:12px; color:#64748b; margin-top:4px; line-height:1.6; }
  .info { font-size:17px; line-height:1.9; }
  .info b { color:#475569; }
  .info a { color:#2563eb; font-weight:bold; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 22px; border-radius:999px; font-size:15px; opacity:0; pointer-events:none; transition:.25s; z-index:300; white-space:nowrap; }
  #toast.show { opacity:1; }


  /* ===== 印刷 ===== */
  #printArea { display:none; }
  @media print {
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block !important; }
    body { background:#fff; display:block; height:auto; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  .pr h2 { font-size:17pt; margin-bottom:5pt; }
  .prT { width:100%; border-collapse:collapse; table-layout:fixed; }
  .prT th { border:1px solid #444; background:#eee; font-size:12pt; padding:3pt; }
  .prT th.sa { color:#1d4ed8; } .prT th.su { color:#dc2626; }
  .prT td { border:1px solid #444; vertical-align:top; padding:3pt; font-size:10.5pt; font-weight:bold; }
  .prT td .d { font-size:14pt; font-weight:900; }
  .prT td .x { font-weight:normal; font-size:8.5pt; color:#444; margin-left:1.2em; }
  .prT td .u { color:#dc2626; }
  .prT td .g { color:#999; text-decoration:line-through; }
  .ck { display:inline-block; width:10pt; height:10pt; border:1.2pt solid #333; margin-right:4pt; vertical-align:-1pt; }

  @media (max-width:760px) {
    body { height:auto; }
    .title { font-size:19px; min-width:0; }
    header h1 { display:none; }
    .three { grid-template-columns:1fr; }
    .day { border-right:none; border-bottom:2px solid #57534e; }
    .dBody { --fs:19px !important; overflow:visible !important; }
    .mGrid { grid-auto-rows:minmax(90px,auto); }
    .mb { --fs:10px !important; overflow:visible; }
    .mb.two { column-count:1; }
    .mn { font-size:15px; } .mhol, .mcnt { display:none; }
  }
</style>
</head>
<body>

<header>
  <button class="backPhone" onclick="location.href='index.html'">← 📞 電話依頼へ</button>
  <button class="nav" onclick="move(-1)">◀</button>
  <div class="title" id="title"></div>
  <button class="nav" onclick="move(1)">▶</button>
  <button class="tBtn" onclick="goToday()">今日</button>
  <div class="modeSw">
    <button id="sw3" onclick="setMode('three')">3日</button>
    <button id="swM" onclick="setMode('month')">1か月</button>
  </div>
  <div class="spacer"></div>
  <span class="legendMini"><span class="bx">電</span>電話依頼　<span class="bx">定</span>通常回収　<span class="bx">機</span>機械移動</span>
  <button class="addBtn" onclick="openForm(null, focusDay)">＋ 予定を追加</button>
  <div class="menuWrap">
    <button class="tBtn" onclick="toggleMenu(event)">⋯</button>
    <div class="menu" id="menu">
      <button onclick="printView()">🖨 この画面を印刷</button>
    </div>
  </div>
</header>

<main id="main"></main>

<!-- 予定(通常回収・その他)の入力・詳細 -->
<div class="modalBg" id="formBg" onclick="if(event.target===this)closeForm()">
  <div class="modal">
    <h3 id="formTitle">＋ 予定を追加</h3>
    <div class="hint" id="formSub"></div>

    <label class="f">種類</label>
    <div class="seg" id="kindSeg">
      <button type="button" data-v="regular" onclick="setSeg('kindSeg',this)">🔁 通常回収</button>
      <button type="button" data-v="machine" onclick="setSeg('kindSeg',this)">🏗 機械移動</button>
    </div>

    <label class="f">会社名(取引先マスタから、あいうえお・よみがなで探せます)</label>
    <input type="text" id="fName" placeholder="会社名かよみがなを入れる(マスタにない会社も書けます)" lang="ja" autocomplete="off" oninput="kanaSel='';renderPicker()" onfocus="renderPicker()">
    <div class="kana" id="kanaRow"></div>
    <div class="pickList" id="pickList"></div>
    <div class="cInfo" id="cInfo"></div>

    <div id="workWrap"><label class="f">仕事内容</label>
    <textarea id="fWork" rows="3" placeholder="例:ユンボを〇〇現場へ移動・回収" lang="ja"></textarea></div>

    <div class="row2">
      <div><label class="f">日付(繰り返しは開始日)</label><input type="date" id="fDate"></div>
      <div><label class="f">時間</label>
        <div class="seg" id="apSeg">
          <button type="button" data-v="" onclick="setSeg('apSeg',this)">なし</button>
          <button type="button" data-v="午前" onclick="setSeg('apSeg',this)">午前</button>
          <button type="button" data-v="午後" onclick="setSeg('apSeg',this)">午後</button>
        </div>
      </div>
    </div>

    <label class="f">繰り返し</label>
    <div class="seg" id="repSeg">
      <button type="button" data-v="none" onclick="setSeg('repSeg',this)">なし</button>
      <button type="button" data-v="weekly" onclick="setSeg('repSeg',this)">毎週</button>
      <button type="button" data-v="biweekly" onclick="setSeg('repSeg',this)">隔週</button>
      <button type="button" data-v="monthlyDate" onclick="setSeg('repSeg',this)">毎月○日</button>
      <button type="button" data-v="monthlyNth" onclick="setSeg('repSeg',this)">毎月第○○曜</button>
    </div>
    <div class="hint" id="repHint"></div>
    <div id="endWrap"><label class="f">繰り返しの終わり(空欄ならずっと)</label><input type="date" id="fEnd"></div>

    <div id="collectWrap">
    <label class="f">品目</label>
    <input type="text" id="fHinmoku" placeholder="例:廃プラ・金属くず" lang="ja" autocomplete="off">

    <label class="f">持ち物</label>
    <div class="itemsGrid">
      <span>穴ありドラム缶</span><input type="text" id="iHole" value="0" onfocus="this.select()"><span>本</span>
      <span>穴なしドラム缶</span><input type="text" id="iNoHole" value="0" onfocus="this.select()"><span>本</span>
      <span>フレコン</span><input type="text" id="iFlex" value="0" onfocus="this.select()"><span>枚</span>
      <span>箱</span><input type="text" id="iBox" value="0" onfocus="this.select()"><span>個</span>
    </div>
    <input type="text" id="iOther" placeholder="持ち物その他(品名・数量など)" lang="ja" autocomplete="off" style="margin-top:8px;">
    </div>

    <div class="row2">
      <div><label class="f">先方の担当者</label><input type="text" id="fContact" placeholder="例:山田様" lang="ja" autocomplete="off"></div>
      <div><label class="f">電話番号</label><input type="text" id="fTel" placeholder="マスタから自動で入ります" autocomplete="off"></div>
    </div>

    <label class="f">メモ</label>
    <textarea id="fMemo" rows="2" placeholder="注意点・連絡事項など" lang="ja"></textarea>

    <div id="doneWrap">
      <label class="f" id="doneLabel">この日の結果</label>
      <div class="seg stSeg" id="stSeg">
        <button type="button" data-v="" onclick="setSeg('stSeg',this)">予定</button>
        <button type="button" data-v="done" onclick="setSeg('stSeg',this)">✅ 行けた</button>
        <button type="button" data-v="missed" onclick="setSeg('stSeg',this)">✖ 行けなかった</button>
      </div>
      <button type="button" class="btn sub" id="redoBtn" style="width:100%;margin-top:8px;display:none;" onclick="redoOther()">📅 別の日に入れ直す</button>
    </div>

    <div class="btnRow">
      <button class="btn sub" onclick="closeForm()">閉じる</button>
      <button class="btn main" id="saveBtn" onclick="saveForm()">保存</button>
      <button class="btn del" id="delBtn" onclick="deleteFromForm()">🗑 この予定を消す</button>
    </div>
  </div>
</div>

<!-- 電話依頼の引取(詳細) -->
<div class="modalBg" id="phoneBg" onclick="if(event.target===this)closePhone()">
  <div class="modal">
    <h3 id="phTitle"></h3>
    <div class="info" id="phInfo"></div>
    <label class="f">回収予定日(直すと電話依頼の方も直ります)</label>
    <div class="row2">
      <input type="date" id="phDate">
      <div class="seg" id="phApSeg">
        <button type="button" data-v="" onclick="setSeg('phApSeg',this)">なし</button>
        <button type="button" data-v="午前" onclick="setSeg('phApSeg',this)">午前</button>
        <button type="button" data-v="午後" onclick="setSeg('phApSeg',this)">午後</button>
      </div>
    </div>
    <label class="f">引取の結果</label>
    <div class="seg stSeg" id="phStSeg">
      <button type="button" data-v="" onclick="setSeg('phStSeg',this)">予定</button>
      <button type="button" data-v="done" onclick="setSeg('phStSeg',this)">✅ 行けた</button>
      <button type="button" data-v="missed" onclick="setSeg('phStSeg',this)">✖ 行けなかった</button>
    </div>
    <div class="hint">行けなかったときは、回収予定日を別の日に直して保存すれば入れ直せます</div>
    <div class="btnRow">
      <button class="btn sub" onclick="closePhone()">閉じる</button>
      <button class="btn main" onclick="savePhone()">保存</button>
      <button class="btn blue" style="flex:0 0 100%;" onclick="window.open('https://rie4649.github.io/denwa-irai/','_blank')">📞 電話依頼で開く(ほかの内容を直す)</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script>
const firebaseConfig = {
  apiKey:"AIzaSyD99MxOMnGplSQjV7830bS7-gdCBSM9DGY",
  authDomain:"sekine-store.firebaseapp.com",
  projectId:"sekine-store",
  storageBucket:"sekine-store.firebasestorage.app",
  messagingSenderId:"781856496751",
  appId:"1:781856496751:web:e2e1e5de4cd803415a819a"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const EVENT_COL = "calendarEvents";   // カレンダーで入れる予定(通常回収・その他)
const PHONE_COL = "phoneRequests";    // 電話依頼(回収予定日があるものを表示)
const CLIENT_COL = "master_clients";  // 取引先マスタ(会社名・電話の候補)

let events = [], phones = [];
let clients = null;       // 入力画面を開いたときだけ読む(読み取り節約)
let editingId = null, editingDate = null, phoneId = null;

/* ===== 日付 ===== */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (ds, n) => { const d = parseYmd(ds); d.setDate(d.getDate()+n); return ymd(d); };
const WD = ["日","月","火","水","木","金","土"];
const todayYmd = () => ymd(new Date());
function mondayOf(ds){ const d = parseYmd(ds); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function mdw(ds){ const d = parseYmd(ds); return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 2200); }
function shortName(n){ return String(n||"").replace(/株式会社|有限会社|合同会社|㈱|㈲|\(株\)|（株）|\(有\)|（有）/g,"").trim() || n; }
const gv = id => document.getElementById(id).value;
function numOf(v){ const n = parseInt(String(v||"").normalize("NFKC").replace(/[^0-9]/g,""),10); return isNaN(n)?0:n; }

/* ===== 祝日(自動計算) ===== */
const holCache = {};
function nthWeekday(y,m,wd,n){ const f = new Date(y,m-1,1).getDay(); return 1+((wd-f+7)%7)+(n-1)*7; }
function holidaysOf(y){
  if (holCache[y]) return holCache[y];
  const h = {}; const add = (m,d,n) => { h[y+"-"+pad(m)+"-"+pad(d)] = n; };
  add(1,1,"元日"); add(2,11,"建国記念の日"); add(2,23,"天皇誕生日"); add(4,29,"昭和の日");
  add(5,3,"憲法記念日"); add(5,4,"みどりの日"); add(5,5,"こどもの日"); add(8,11,"山の日");
  add(11,3,"文化の日"); add(11,23,"勤労感謝の日");
  add(1,nthWeekday(y,1,1,2),"成人の日"); add(7,nthWeekday(y,7,1,3),"海の日");
  add(9,nthWeekday(y,9,1,3),"敬老の日"); add(10,nthWeekday(y,10,1,2),"スポーツの日");
  const k = y-1980;
  add(3,Math.floor(20.8431+0.242194*k-Math.floor(k/4)),"春分の日");
  add(9,Math.floor(23.2488+0.242194*k-Math.floor(k/4)),"秋分の日");
  Object.keys(h).forEach(key => { const mid = addDays(key,1), nx = addDays(key,2);
    if (h[nx] && !h[mid] && parseYmd(mid).getDay() !== 0) h[mid] = "国民の休日"; });
  Object.keys(h).sort().forEach(key => { if (parseYmd(key).getDay() === 0){ let s = addDays(key,1); while (h[s]) s = addDays(s,1); h[s] = "振替休日"; } });
  return holCache[y] = h;
}
const holidayName = ds => holidaysOf(Number(ds.slice(0,4)))[ds] || "";

/* ===== 繰り返し ===== */
function occursOn(ev, ds){
  if (!ev.date || ds < ev.date) return false;
  if (ev.endDate && ds > ev.endDate) return false;
  if ((ev.skipDates||[]).includes(ds)) return false;
  const rep = ev.repeat || "none";
  if (rep === "none") return ds === ev.date;
  const d = parseYmd(ds), s = parseYmd(ev.date);
  if (rep === "weekly") return d.getDay() === s.getDay();
  if (rep === "biweekly") return d.getDay() === s.getDay() && Math.round((d-s)/(7*86400000)) % 2 === 0;
  if (rep === "monthlyDate") return d.getDate() === s.getDate();
  if (rep === "monthlyNth") return d.getDay() === s.getDay() && Math.ceil(d.getDate()/7) === Math.ceil(s.getDate()/7);
  return false;
}
function repeatText(ev){
  const rep = ev.repeat || "none"; if (rep === "none" || !ev.date) return "";
  const s = parseYmd(ev.date);
  return rep==="weekly" ? "毎週"+WD[s.getDay()]+"曜" : rep==="biweekly" ? "隔週"+WD[s.getDay()]+"曜"
    : rep==="monthlyDate" ? "毎月"+s.getDate()+"日" : rep==="monthlyNth" ? "毎月第"+Math.ceil(s.getDate()/7)+WD[s.getDay()]+"曜" : "";
}
function itemsText(it){
  it = it || {}; const p = [];
  if (it.holeDrum>0) p.push("穴ありドラム缶"+it.holeDrum+"本");
  if (it.noHoleDrum>0) p.push("穴なしドラム缶"+it.noHoleDrum+"本");
  if (it.flexBag>0) p.push("フレコン"+it.flexBag+"枚");
  if (it.box>0) p.push("箱"+it.box+"個");
  if (it.other) p.push(it.other);
  return p.join("・");
}

/* その日の予定(午前 → 時間なし → 午後、その中は 電話依頼 → 通常回収 → その他) */
function itemsOn(ds){
  const list = [];
  phones.forEach(p => {
    if (p.pickupDate !== ds) return;
    const urg = p.urgency && p.urgency !== "通常" ? p.urgency : "";
    list.push({ type:"pickup", id:p.id, name:p.client||"(会社名なし)", ampm:p.ampm||"", urgent:!!urg, urgency:urg,
      done:p.status==="対応済み"||p.pickupResult==="done", missed:p.pickupResult==="missed"&&p.status!=="対応済み", sub:[urg, (p.contents||[]).join("、"), itemsText(p.items)].filter(Boolean).join(" / "), src:p });
  });
  events.forEach(ev => {
    if (!occursOn(ev, ds)) return;
    const rt = repeatText(ev);
    const isM = ev.kind==="machine" || ev.kind==="other";
    list.push({ type:isM?"machine":"regular", id:ev.id, name:ev.title||"", ampm:ev.ampm||"",
      done:(ev.doneDates||[]).includes(ds), missed:(ev.missedDates||[]).includes(ds),
      sub:(isM ? [ev.work, ev.memo, rt] : [ev.hinmoku, itemsText(ev.items), ev.memo, rt]).filter(Boolean).join(" / "), src:ev });
  });
  const ar = {"午前":0, "":1, "午後":2}, tr = {pickup:0, regular:1, machine:2};
  list.sort((a,b) => (ar[a.ampm]-ar[b.ampm]) || (tr[a.type]-tr[b.type]) || a.name.localeCompare(b.name,"ja"));
  return list;
}
/* ===== 表示の状態 ===== */
let viewMode = "three";   // "three" = 3日 / "month" = 1か月
let focusDay = todayYmd(); // 3日表示の真ん中の日
let monthY, monthM;        // 1か月表示の年・月

const SEC_LABEL = {"午前":"午前", "":"時間指定なし", "午後":"午後"};
function iconOf(it){ return '<span class="bx">'+(it.type==="pickup" ? "電" : it.type==="regular" ? "定" : "機")+'</span>'; }
function iconTxt(it){ return it.type==="pickup" ? "[電]" : it.type==="regular" ? "[定]" : "[機]"; }
function clsOf(it){ return (it.urgent&&!it.done&&!it.missed?"urgent ":"")+(it.done?"isDone":"")+(it.missed?" isMissed":""); }
function dayClass(ds){
  const d = parseYmd(ds), c = [];
  if (d.getDay()===6) c.push("sat"); if (d.getDay()===0) c.push("sun");
  if (holidayName(ds)) c.push("hol");
  if (ds === todayYmd()) c.push("today");
  return c.join(" ");
}
function sectioned(items, fn){
  let out = "", last = null;
  const useSec = items.some(it => it.ampm);
  items.forEach(it => {
    if (useSec && it.ampm !== last){ out += '<div class="sec">'+SEC_LABEL[it.ampm]+'</div>'; last = it.ampm; }
    out += fn(it);
  });
  return out;
}
function itHtml(it, ds, withSub){
  return '<div class="it '+clsOf(it)+'" onclick="event.stopPropagation();openItem(\''+it.type+'\',\''+it.id+'\',\''+ds+'\')">'+
    '<span class="mk">'+iconOf(it)+'</span><span class="nm">'+esc(withSub?it.name:shortName(it.name))+'</span>'+(it.done?'<span class="mk">✅</span>':'')+(it.missed?'<span class="miss">行けず</span>':'')+'</div>'+
    (withSub && it.sub ? '<div class="sub">'+esc(it.sub)+'</div>' : '');
}

/* ===== 描画 ===== */
function render(){
  document.getElementById("main").classList.toggle("scrollMain", viewMode==="month");
  document.getElementById("sw3").classList.toggle("on", viewMode==="three");
  document.getElementById("swM").classList.toggle("on", viewMode==="month");
  if (viewMode === "three") renderThree(); else renderMonth();
}

function renderThree(){
  const days = [addDays(focusDay,-1), focusDay, addDays(focusDay,1)];
  const f = parseYmd(focusDay);
  document.getElementById("title").textContent = f.getFullYear()+"年"+(f.getMonth()+1)+"月"+f.getDate()+"日("+WD[f.getDay()]+")";
  document.getElementById("main").innerHTML = '<div class="three">'+days.map(ds => {
    const d = parseYmd(ds), hol = holidayName(ds), items = itemsOn(ds);
    return '<div class="day '+dayClass(ds)+'">'+
      '<div class="dHead" onclick="openForm(null,\''+ds+'\')" title="押すとこの日に予定を追加">'+
        '<span class="dn">'+(d.getMonth()+1)+'/'+d.getDate()+'</span><span class="dw">('+WD[d.getDay()]+')</span>'+
        (hol?'<span class="dh">'+esc(hol)+'</span>':'')+(ds===todayYmd()?'<span class="todayMark">今日</span>':'')+
        '<span class="cnt">'+(items.length?items.length+'件':'')+'</span>'+
        '<button class="mini" onclick="event.stopPropagation();openForm(null,\''+ds+'\')">＋</button>'+
        '<button class="mini" onclick="event.stopPropagation();printDay(\''+ds+'\')">🖨</button>'+
      '</div>'+
      '<div class="dBody">'+(items.length ? sectioned(items, it => itHtml(it, ds, true)) : '<div class="none">予定なし</div>')+'</div></div>';
  }).join("")+'</div>';
  requestAnimationFrame(() => fitBoxes(".dBody", 24, 13, false));
}

function renderMonth(){
  document.getElementById("title").textContent = monthY+"年"+(monthM+1)+"月";
  const first = new Date(monthY, monthM, 1);
  const offset = (first.getDay()+6)%7;
  const start = ymd(new Date(monthY, monthM, 1-offset));
  const last = new Date(monthY, monthM+1, 0).getDate();
  const weeks = Math.ceil((offset+last)/7);
  let cells = "";
  for (let i = 0; i < weeks*7; i++){
    const ds = addDays(start, i), d = parseYmd(ds), hol = holidayName(ds), items = itemsOn(ds);
    cells += '<div class="mc '+dayClass(ds)+(d.getMonth()!==monthM?' other':'')+'" onclick="openThree(\''+ds+'\')">'+
      '<div class="mh"><span class="mn">'+d.getDate()+'</span>'+(hol?'<span class="mhol">'+esc(hol)+'</span>':'')+
      (items.length?'<span class="mcnt">'+items.length+'件</span>':'')+'</div>'+
      '<div class="mb'+(items.length>10?' two':'')+'">'+items.map(it => itHtml(it, ds, false)).join("")+'</div></div>';
  }
  document.getElementById("main").innerHTML = '<div class="mWrap"><div class="dow"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sa">土</div><div class="su">日</div></div>'+
    '<div class="mGrid" style="grid-auto-rows:minmax(max(110px, calc((100vh - 110px) / '+weeks+')), auto)">'+cells+'</div></div>';
}

/* 入りきらないときは隠さず、文字を小さく(1か月は2列にも)して全部入れる */
function fitBoxes(sel, max, min, allowTwo){
  if (window.innerWidth <= 760) return;
  document.querySelectorAll(sel).forEach(b => {
    const over = () => b.scrollHeight > b.clientHeight + 1;
    let fs = max; b.classList.remove("two","scroll"); b.style.setProperty("--fs", fs+"px");
    const floor1 = allowTwo ? 12 : min;
    while (over() && fs > floor1){ fs--; b.style.setProperty("--fs", fs+"px"); }
    if (over() && allowTwo){
      b.classList.add("two"); fs = max - 1; b.style.setProperty("--fs", fs+"px");
      while (over() && fs > min){ fs--; b.style.setProperty("--fs", fs+"px"); }
    }
    if (over()) b.classList.add("scroll");
  });
}
window.addEventListener("resize", () => { clearTimeout(window.__rt); window.__rt = setTimeout(render, 200); });

/* ===== 切り替え ===== */
function setMode(m){
  if (m === "month"){ const f = parseYmd(focusDay); monthY = f.getFullYear(); monthM = f.getMonth(); }
  viewMode = m; render();
}
function openThree(ds){ focusDay = ds; viewMode = "three"; render(); }
function move(n){
  if (viewMode === "three") focusDay = addDays(focusDay, n);
  else { monthM += n; if (monthM < 0){ monthM = 11; monthY--; } if (monthM > 11){ monthM = 0; monthY++; } }
  render();
}
function goToday(){ focusDay = todayYmd(); const t = new Date(); monthY = t.getFullYear(); monthM = t.getMonth(); render(); }
function toggleMenu(e){ e.stopPropagation(); document.getElementById("menu").classList.toggle("show"); }
document.addEventListener("click", () => document.getElementById("menu").classList.remove("show"));

/* ===== 会社名タップ ===== */
function openItem(type, id, ds){
  if (type === "pickup") openPhone(id); else openForm(id, ds);
}

/* --- 電話依頼の引取 --- */
function openPhone(id){
  const p = phones.find(x => x.id === id); if (!p) return;
  phoneId = id;
  document.getElementById("phTitle").textContent = "🚚 "+(p.client||"");
  const lines = [];
  if (p.urgency && p.urgency !== "通常") lines.push(["緊急度", esc(p.urgency)]);
  lines.push(["状態", p.status==="対応済み" ? "✅ 対応済み" : "未対応"]);
  if (p.requestDate) lines.push(["依頼日", esc(p.requestDate)]);
  if (p.clientDept) lines.push(["部署", esc(p.clientDept)]);
  if (p.clientContact) lines.push(["担当者", esc(p.clientContact)]);
  if (p.phone) lines.push(["電話", '<a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a>']);
  if ((p.contents||[]).length) lines.push(["依頼内容", esc(p.contents.join("、"))]);
  const it = itemsText(p.items); if (it) lines.push(["持ち物", esc(it)]);
  if (p.responseText) lines.push(["対応内容", esc(p.responseText)]);
  if (p.staff && p.staff !== "未選択") lines.push(["電話受付", esc(p.staff)]);
  document.getElementById("phInfo").innerHTML = lines.map(l => "<div><b>"+l[0]+":</b>"+l[1]+"</div>").join("");
  document.getElementById("phDate").value = p.pickupDate || "";
  setSegVal("phApSeg", p.ampm || "");
  setSegVal("phStSeg", p.pickupResult || "");
  document.getElementById("phoneBg").classList.add("show");
}
function closePhone(){ document.getElementById("phoneBg").classList.remove("show"); phoneId = null; }
async function savePhone(){
  if (!phoneId) return;
  try {
    const p = phones.find(x => x.id === phoneId) || {};
    const newDate = document.getElementById("phDate").value;
    let result = segVal("phStSeg");
    if (result === "missed" && newDate && newDate !== p.pickupDate) result = "";  // 別の日に入れ直したら「予定」に戻す
    await db.collection(PHONE_COL).doc(phoneId).update({ pickupDate: newDate, ampm: segVal("phApSeg"), pickupResult: result });
    closePhone(); toast("✅ 保存しました(電話依頼にも反映)");
  } catch(e){ console.error(e); toast("⚠️ 保存に失敗しました"); }
}

/* --- 通常回収・その他 --- */
function setSeg(id, btn){
  document.querySelectorAll("#"+id+" button").forEach(b => b.classList.toggle("on", b === btn));
  if (id === "kindSeg"){
    const m = btn.dataset.v === "machine";
    document.getElementById("workWrap").style.display = m ? "" : "none";
    document.getElementById("collectWrap").style.display = m ? "none" : "";
  }
  if (id === "stSeg") document.getElementById("redoBtn").style.display = (btn.dataset.v === "missed" && editingId) ? "" : "none";
  if (id === "repSeg") document.getElementById("endWrap").style.display = btn.dataset.v==="none" ? "none" : "";
  updateRepHint();
}
function segVal(id){ const b = document.querySelector("#"+id+" button.on"); return b ? b.dataset.v : ""; }
function setSegVal(id, v){ setSeg(id, document.querySelector("#"+id+" button[data-v='"+v+"']") || document.querySelector("#"+id+" button")); }
function updateRepHint(){
  const ds = document.getElementById("fDate").value, rep = segVal("repSeg");
  document.getElementById("repHint").textContent = (ds && rep && rep !== "none") ? "→ "+repeatText({date:ds, repeat:rep})+" に表示します" : "";
}
document.getElementById("fDate").addEventListener("change", updateRepHint);
/* ===== 会社さがし(あいうえお・よみがな) ===== */
const KANA_ROWS = [["あ","あいうえおぁぃぅぇぉ"],["か","かきくけこがぎぐげご"],["さ","さしすせそざじずぜぞ"],["た","たちつてとだぢづでどっ"],["な","なにぬねの"],
  ["は","はひふへほばびぶべぼぱぴぷぺぽ"],["ま","まみむめも"],["や","やゆよゃゅょ"],["ら","らりるれろ"],["わ","わをん"]];
let kanaSel = "";
function toHira(s){ return String(s||"").normalize("NFKC").replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60)); }
function rowOf(c){
  const h = toHira((c.yomi||c.name||"").trim()).charAt(0);
  const r = KANA_ROWS.find(r => r[1].includes(h));
  return r ? r[0] : "他";
}
function buildKana(){
  document.getElementById("kanaRow").innerHTML = KANA_ROWS.map(r => '<button type="button" data-k="'+r[0]+'" onclick="pickKana(\''+r[0]+'\')">'+r[0]+'</button>').join("")+
    '<button type="button" data-k="他" onclick="pickKana(\'他\')">他</button>';
}
function pickKana(k){ kanaSel = (kanaSel === k) ? "" : k; document.getElementById("fName").value = ""; renderPicker(); }
function renderPicker(){
  document.querySelectorAll("#kanaRow button").forEach(b => b.classList.toggle("on", b.dataset.k === kanaSel));
  const box = document.getElementById("pickList");
  if (!clients){ box.innerHTML = '<div class="none2">取引先を読み込み中…</div>'; return; }
  const q = document.getElementById("fName").value.trim();
  let list;
  if (kanaSel) list = clients.filter(c => rowOf(c) === kanaSel);
  else if (q) { const hq = toHira(q).toLowerCase(); list = clients.filter(c => toHira(c.name).toLowerCase().includes(hq) || toHira(c.yomi||"").includes(hq)); }
  else { box.innerHTML = '<div class="none2">上の「あかさたな」を押すか、名前を入れると候補が出ます</div>'; return; }
  box.innerHTML = list.length ? list.slice(0,80).map(c => '<div onclick="chooseClient(\''+c.id+'\')">'+esc(c.name)+(c.yomi?'<small>'+esc(c.yomi)+'</small>':'')+'</div>').join("")
    : '<div class="none2">マスタに見つかりません(このまま名前を書いて保存もできます)</div>';
}
function chooseClient(id){
  const c = clients.find(x => x.id === id); if (!c) return;
  document.getElementById("fName").value = c.name;
  kanaSel = ""; document.getElementById("pickList").innerHTML = "";
  document.querySelectorAll("#kanaRow button").forEach(b => b.classList.remove("on"));
  const tel = document.getElementById("fTel"); if (c.tel && !tel.value) tel.value = c.tel;
  showClientInfo(c);
}
function showClientInfo(c){
  const box = document.getElementById("cInfo");
  if (!c || (!c.address && !c.tel)){ box.style.display = "none"; return; }
  box.innerHTML = (c.address ? '📍 '+esc(c.address)+'<br>' : '')+(c.tel ? '☎ '+esc(c.tel)+'<br>' : '')+
    (c.address ? '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address)+'" target="_blank">🗺 Googleマップで開く</a>' : '')+
    (c.address ? '<a href="https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent("長野県上田市住吉316-2")+'&destination='+encodeURIComponent(c.address)+'" target="_blank">🚚 会社からの道順</a>' : '')+
    (c.tel ? '<a href="tel:'+esc(c.tel)+'">☎ 電話する</a>' : '');
  box.style.display = "block";
}
buildKana();

function kindOf(ev){ return (ev.kind==="machine"||ev.kind==="other") ? "machine" : "regular"; }
async function loadClients(){
  if (clients) return;
  try {
    const snap = await db.collection(CLIENT_COL).get();
    clients = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(c => c.name);
    clients.sort((a,b) => toHira(a.yomi||a.name).localeCompare(toHira(b.yomi||b.name), "ja"));
    if (document.getElementById("formBg").classList.contains("show")){
      renderPicker();
      const c = clients.find(x => x.name === document.getElementById("fName").value.trim()); if (c) showClientInfo(c);
    }
  } catch(e){ console.error(e); clients = []; }
}

function openForm(id, ds){
  loadClients();
  editingId = id || null; editingDate = ds || todayYmd();
  const ev = id ? events.find(e => e.id === id) : null;
  document.getElementById("formTitle").textContent = ev ? (kindOf(ev)==="machine"?"🏗 ":"🔁 ")+(ev.title||"") : "＋ 予定を追加";
  document.getElementById("formSub").textContent = ev ? mdw(editingDate)+" の予定"+(repeatText(ev)?"(繰り返し:"+repeatText(ev)+")":"") : "";
  setSegVal("kindSeg", ev ? kindOf(ev) : "regular");
  document.getElementById("fName").value = ev ? (ev.title||"") : "";
  document.getElementById("fWork").value = ev ? (ev.work||"") : "";
  kanaSel = ""; document.getElementById("pickList").innerHTML = "";
  document.querySelectorAll("#kanaRow button").forEach(b => b.classList.remove("on"));
  const cc = ev && clients ? clients.find(x => x.id === ev.clientId || x.name === ev.title) : null;
  showClientInfo(cc);
  document.getElementById("fDate").value = ev ? ev.date : editingDate;
  setSegVal("apSeg", ev ? (ev.ampm||"") : "");
  setSegVal("repSeg", ev ? (ev.repeat||"none") : "none");
  document.getElementById("fEnd").value = ev ? (ev.endDate||"") : "";
  document.getElementById("fHinmoku").value = ev ? (ev.hinmoku||"") : "";
  const it = (ev && ev.items) || {};
  document.getElementById("iHole").value = it.holeDrum||0;
  document.getElementById("iNoHole").value = it.noHoleDrum||0;
  document.getElementById("iFlex").value = it.flexBag||0;
  document.getElementById("iBox").value = it.box||0;
  document.getElementById("iOther").value = it.other||"";
  document.getElementById("fContact").value = ev ? (ev.contact||"") : "";
  document.getElementById("fTel").value = ev ? (ev.tel||"") : "";
  document.getElementById("fMemo").value = ev ? (ev.memo||"") : "";
  document.getElementById("doneWrap").style.display = ev ? "" : "none";
  document.getElementById("doneLabel").textContent = mdw(editingDate)+" の結果";
  setSegVal("stSeg", ev ? ((ev.doneDates||[]).includes(editingDate) ? "done" : (ev.missedDates||[]).includes(editingDate) ? "missed" : "") : "");
  document.getElementById("delBtn").style.display = ev ? "" : "none";
  updateRepHint();
  document.getElementById("formBg").classList.add("show");
}
function closeForm(){ document.getElementById("formBg").classList.remove("show"); editingId = null; }

async function saveForm(){
  const title = document.getElementById("fName").value.trim();
  const date = document.getElementById("fDate").value;
  if (!title){ toast("会社名を入れてください"); return; }
  if (!date){ toast("日付を入れてください"); return; }
  const rep = segVal("repSeg") || "none";
  const endDate = rep === "none" ? "" : document.getElementById("fEnd").value;
  if (endDate && endDate < date){ toast("終わりの日が開始日より前です"); return; }
  const c = (clients||[]).find(x => x.name === title);
  const data = {
    kind: segVal("kindSeg") || "regular", title, clientId: c ? c.id : "",
    work: document.getElementById("fWork").value.trim(),
    date, ampm: segVal("apSeg"), repeat: rep, endDate,
    hinmoku: document.getElementById("fHinmoku").value.trim(),
    items: { holeDrum:numOf(gv("iHole")), noHoleDrum:numOf(gv("iNoHole")), flexBag:numOf(gv("iFlex")), box:numOf(gv("iBox")), other:gv("iOther").trim() },
    contact: document.getElementById("fContact").value.trim(),
    tel: document.getElementById("fTel").value.normalize("NFKC").trim(),
    memo: document.getElementById("fMemo").value.trim(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const btn = document.getElementById("saveBtn"); btn.disabled = true;
  try {
    if (editingId){
      const FV = firebase.firestore.FieldValue;
      const st = segVal("stSeg");
      data.doneDates = st === "done" ? FV.arrayUnion(editingDate) : FV.arrayRemove(editingDate);
      data.missedDates = st === "missed" ? FV.arrayUnion(editingDate) : FV.arrayRemove(editingDate);
      await db.collection(EVENT_COL).doc(editingId).update(data);
    } else {
      await db.collection(EVENT_COL).add({ ...data, skipDates:[], doneDates:[], missedDates:[], createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    closeForm(); toast("✅ 保存しました");
  } catch(e){ console.error(e); toast("⚠️ 保存に失敗しました"); }
  finally { btn.disabled = false; }
}
/* 行けなかった予定を、別の日に1回分だけ入れ直す(元の予定は「行けなかった」のまま残る) */
async function redoOther(){
  if (editingId){
    try { await db.collection(EVENT_COL).doc(editingId).update({
      missedDates: firebase.firestore.FieldValue.arrayUnion(editingDate),
      doneDates: firebase.firestore.FieldValue.arrayRemove(editingDate) }); } catch(e){ console.error(e); }
  }
  editingId = null;
  document.getElementById("formTitle").textContent = "📅 別の日に入れ直す";
  document.getElementById("formSub").textContent = "日付を選んで保存してください(1回だけの予定になります)";
  document.getElementById("fDate").value = addDays(editingDate, 1);
  setSegVal("repSeg", "none");
  document.getElementById("doneWrap").style.display = "none";
  document.getElementById("delBtn").style.display = "none";
  document.getElementById("fDate").focus();
}
async function deleteFromForm(){
  const ev = events.find(e => e.id === editingId); if (!ev) return;
  const ds = editingDate;
  try {
    if ((ev.repeat||"none") !== "none"){
      if (confirm("「"+ev.title+"」\n"+mdw(ds)+" の分だけ消しますか?\n\n[OK] この日だけ消す\n[キャンセル] 繰り返しごと全部消すか選ぶ")){
        await db.collection(EVENT_COL).doc(ev.id).update({ skipDates: firebase.firestore.FieldValue.arrayUnion(ds) });
        closeForm(); toast("この日だけ消しました"); return;
      }
      if (!confirm("繰り返しの予定「"+ev.title+"」を全部消します。よろしいですか?")) return;
    } else if (!confirm("「"+ev.title+"」を消しますか?")) return;
    await db.collection(EVENT_COL).doc(ev.id).delete();
    closeForm(); toast("消しました");
  } catch(e){ console.error(e); toast("⚠️ 失敗しました"); }
}

/* ===== 印刷 ===== */
function doPrint(html, size){
  document.getElementById("menu").classList.remove("show");
  document.getElementById("pageStyle").textContent = "@page { size: "+size+"; margin: 8mm; }";
  document.getElementById("printArea").innerHTML = html;
  setTimeout(() => window.print(), 50);
}
function prItem(it, withSub){
  const c = (it.done||it.missed) ? "g" : (it.urgent ? "u" : "");
  return '<div><span class="ck"></span><span class="'+c+'">'+iconTxt(it)+esc(withSub?it.name:shortName(it.name))+(it.ampm&&withSub?'('+esc(it.ampm)+')':'')+'</span></div>'+
    (withSub&&it.sub?'<div class="x">'+esc(it.sub)+'</div>':'');
}
function printView(){
  if (viewMode === "three"){
    const days = [addDays(focusDay,-1), focusDay, addDays(focusDay,1)];
    doPrint('<div class="pr"><h2>📅 '+days.map(mdw).join("・")+'</h2><table class="prT"><tr>'+
      days.map(ds => '<th class="'+(parseYmd(ds).getDay()===6?"sa":(parseYmd(ds).getDay()===0||holidayName(ds))?"su":"")+'">'+mdw(ds)+'</th>').join("")+'</tr><tr style="height:175mm">'+
      days.map(ds => '<td>'+itemsOn(ds).map(it => prItem(it, true)).join("")+'</td>').join("")+'</tr></table></div>', "A4 landscape");
  } else {
    const first = new Date(monthY, monthM, 1), offset = (first.getDay()+6)%7;
    const start = ymd(new Date(monthY, monthM, 1-offset)), last = new Date(monthY, monthM+1, 0).getDate();
    const weeks = Math.ceil((offset+last)/7);
    let rows = "";
    for (let w = 0; w < weeks; w++){
      rows += '<tr style="height:'+Math.floor(250/weeks)+'mm">';
      for (let i = 0; i < 7; i++){
        const ds = addDays(start, w*7+i), d = parseYmd(ds);
        rows += '<td><div class="d" style="color:'+(d.getMonth()!==monthM?"#ccc":(d.getDay()===0||holidayName(ds))?"#dc2626":d.getDay()===6?"#1d4ed8":"#111")+'">'+d.getDate()+'</div>'+
          (d.getMonth()===monthM ? itemsOn(ds).map(it => '<div class="'+(it.done?"g":it.urgent?"u":"")+'" style="font-size:8pt">'+esc(shortName(it.name))+'</div>').join("") : "")+'</td>';
      }
      rows += '</tr>';
    }
    doPrint('<div class="pr"><h2>📅 '+monthY+'年'+(monthM+1)+'月</h2><table class="prT"><tr><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="sa">土</th><th class="su">日</th></tr>'+rows+'</table></div>', "A3 landscape");
  }
}
function printDay(ds){
  const items = itemsOn(ds);
  doPrint('<div class="pr"><h2>📅 '+mdw(ds)+' の回収予定('+items.length+'件)</h2><table class="prT"><tr><td style="font-size:14pt;">'+
    (items.length ? sectioned(items, it => prItem(it, true)+((it.src.tel||it.src.phone)?'<div class="x">☎ '+esc(it.src.tel||it.src.phone)+'</div>':'')) : '予定はありません')+
    '</td></tr></table></div>', "A4 portrait");
}

db.collection(PHONE_COL).onSnapshot(snap => { phones = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(p => p.pickupDate); render(); },

setInterval(() => { const t = todayYmd(); if (t !== lastDay){ lastDay = t; goToday(); } }, 60000);

goToday();
