<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電話依頼</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;}
body{background:#eef3f8;margin:0;padding-bottom:60px;font-family:Arial,"Hiragino Sans",sans-serif;}
header{background:#1565c0;color:white;padding:20px 10px;text-align:center;position:relative;}
header h1{font-size:26px;margin:0;}
.gear{position:absolute;top:16px;right:16px;background:none;border:none;color:white;font-size:26px;cursor:pointer;}
.installIconBtn{position:absolute;top:16px;left:16px;background:none;border:none;color:white;font-size:26px;cursor:pointer;}
.wrap{max-width:640px;margin:0 auto;padding:16px;}
.sectionLabel{display:inline-block;font-size:18px;font-weight:bold;padding:10px 22px;border-radius:14px;margin:16px 0 10px;color:white;}
.sectionLabel.pending{background:#e53935;}
.sectionLabel.doneLabel{background:#2e9d45;}
.reportCard{background:#fff8e1;border:2px solid #f59e0b;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;animation:reportIn .3s ease;}
@keyframes reportIn{from{transform:translateY(-8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.reportCard .rIcon{font-size:26px;}
.reportCard .rBody{flex:1;font-size:14px;line-height:1.5;}
.reportCard .rBody b{font-size:16px;}
.reportCard .rOk{border:none;background:#f59e0b;color:#fff;font-weight:bold;font-size:14px;padding:10px 16px;border-radius:10px;cursor:pointer;flex-shrink:0;}
.reportCard .rOk:active{transform:scale(.95);}
.reqCard{background:white;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.1);padding:18px;margin-bottom:10px;cursor:pointer;}
.reqCard.done{opacity:.6;}
.urgBtnRow{display:flex;gap:12px;}
.urgBigBtn{flex:1;padding:26px 10px;font-size:26px;font-weight:900;border-radius:16px;cursor:pointer;transition:.15s;letter-spacing:2px;}
.urgBigBtn.u1{border:3px solid #f59e0b;background:#fff;color:#b45309;}
.urgBigBtn.u2{border:3px solid #dc2626;background:#fff;color:#dc2626;}
.urgBigBtn.u1.selected{background:#f59e0b;color:#fff;box-shadow:0 4px 16px rgba(245,158,11,.5);transform:scale(1.03);}
.urgBigBtn.u2.selected{background:#dc2626;color:#fff;box-shadow:0 4px 16px rgba(220,38,38,.5);transform:scale(1.03);animation:urgBlink 1s infinite;}
.urgBigBtn:active{transform:scale(.95);}
.reqCard.urgent1{border-left:6px solid #f59e0b;}
.reqCard.urgent2{border-left:6px solid #dc2626;background:#fff5f5;}
.urgBadge{display:block;text-align:center;padding:12px;border-radius:12px;font-size:24px;font-weight:900;letter-spacing:4px;margin:4px 0 10px;}
.urgBadge.u1{background:#f59e0b;color:#fff;box-shadow:0 3px 10px rgba(245,158,11,.4);}
.urgBadge.u2{background:#dc2626;color:#fff;animation:urgBlink 1s infinite;box-shadow:0 3px 14px rgba(220,38,38,.5);}
@keyframes urgBlink{0%,100%{opacity:1;}50%{opacity:.5;}}
.doneInfo{font-size:13px;color:#1b7d34;margin-top:6px;font-weight:bold;}
.reqPickup{font-size:19px;font-weight:bold;color:#0b5ed7;background:#e7f1ff;border-radius:10px;padding:8px 12px;margin-top:8px;display:inline-block;}
.callBtn{display:inline-block;border:none;background:#0b5ed7;color:#fff;font-size:17px;font-weight:bold;padding:12px 18px;border-radius:12px;margin-top:8px;margin-right:8px;cursor:pointer;box-shadow:0 3px 10px rgba(11,94,215,.35);animation:callBlink 1.2s infinite;}
@keyframes callBlink{0%,100%{opacity:1;}50%{opacity:.45;}}
.callBtn:active{transform:scale(.95);}
.callBtn.done{background:#e8f8ec;color:#1b7d34;box-shadow:none;animation:none;font-size:15px;padding:8px 14px;}
#acceptPop .popBtnRow{display:flex;gap:8px;margin-top:14px;}
#acceptPop .popBtn{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;}
#acceptPop .popBtn.line{background:#06c755;color:#fff;}
#acceptPop .popBtn.close{background:#eee;color:#555;}
#doneSheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1500;align-items:flex-end;}
#doneSheet.show{display:flex;}
#doneSheet .dsBox{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px 16px 30px;}
#doneSheet h3{font-size:17px;margin:0 0 4px;}
#doneSheet .dsClient{font-size:14px;color:#666;margin-bottom:12px;}
#doneSheet textarea{width:100%;min-height:70px;font-size:16px;padding:10px;border:1.5px solid #aaa;border-radius:10px;box-sizing:border-box;}
#doneSheet .dsBtn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:bold;color:#fff;background:#2e9d45;margin-top:12px;}
#doneSheet .dsCancel{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;color:#555;background:#eee;margin-top:8px;}
.reqTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.reqDate{font-size:26px;color:#1f2937;font-weight:900;letter-spacing:.5px;}
.badge{font-size:15px;font-weight:bold;padding:8px 18px;border-radius:999px;color:white;border:none;cursor:pointer;}
.badge.pending{background:#e53935;}
.badge.done{background:#2e9d45;}
.reqClient{font-size:23px;font-weight:bold;color:#222;margin-bottom:6px;}
.reqContent{font-size:16px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.empty{text-align:center;color:#888;font-size:15px;margin:24px 0;}
.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;background:#1565c0;color:white;border:none;font-size:28px;box-shadow:0 4px 10px rgba(0,0,0,.3);z-index:500;}
/* 詳細モーダル */
.modalScreen{display:none;position:fixed;inset:0;background:#eef3f8;z-index:998;overflow-y:auto;}
.modalScreen.show{display:block;}
.modalHeader{background:#1565c0;color:white;padding:18px 10px;text-align:center;position:relative;}
.modalHeader h2{font-size:20px;margin:0;}
.modalClose{position:absolute;top:16px;left:14px;background:none;border:none;color:white;font-size:17px;font-weight:bold;cursor:pointer;}
.modalBox{max-width:640px;margin:20px auto;background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.detailRow{font-size:17px;line-height:1.9;color:#222;margin-bottom:6px;}
.detailRow b{color:#333;}
.statusBtnGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 10px;}
.statusBtn{padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:bold;color:white;}
.statusBtn.toDone{background:#2e9d45;}
.statusBtn.toPending{background:#e53935;}
.shareBtnGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.shareBtn{padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:bold;color:white;}
.shareBtn.line{background:#06c755;}
.shareBtn.print{background:#555;}
.deleteBtn{width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:bold;color:white;background:#333;margin-top:8px;}
/* 設定（入力フォーム）画面 */
.settingsScreen{display:none;position:fixed;inset:0;background:#eef3f8;z-index:999;overflow-y:auto;}
.settingsScreen.show{display:block;}
.setHeader{background:#1565c0;color:white;padding:18px 10px;text-align:center;position:relative;}
.setHeader h2{font-size:20px;margin:0;}
.closeSet{position:absolute;top:14px;left:14px;background:none;border:none;color:white;font-size:26px;cursor:pointer;}
.box{background:white;margin:16px auto;padding:20px;border-radius:16px;max-width:640px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.field{margin-bottom:18px;}
.field label{display:block;font-size:17px;font-weight:bold;margin-bottom:8px;color:#333;}
.field input[type=text],.field input[type=tel],.field input[type=date],.field input[type=number],.field textarea,.field select{
width:100%;font-size:19px;padding:13px;border-radius:12px;border:1px solid #aaa;
}
.checkGroup{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checkGroup label{
display:flex;align-items:center;gap:8px;
background:#f0f4f8;border:2px solid #ccc;border-radius:12px;padding:12px 10px;
font-size:16px;font-weight:bold;color:#333;cursor:pointer;
}
.checkGroup input{transform:scale(1.3);}
.checkGroup label.checked{background:#1565c0;color:white;border-color:#1565c0;}
.radioGroup{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
#ampmGroup label{white-space:nowrap;font-size:16px;padding:14px 4px;}
.radioGroup label{
display:flex;align-items:center;justify-content:center;gap:8px;
background:#f0f4f8;border:2px solid #ccc;border-radius:12px;padding:14px 6px;
font-size:17px;font-weight:bold;color:#333;cursor:pointer;
}
.radioGroup input{transform:scale(1.3);}
.radioGroup label.checked{background:#1565c0;color:white;border-color:#1565c0;}
.itemsGrid{display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;margin-bottom:12px;}
.itemsGrid span{font-size:17px;font-weight:bold;color:#333;}
.itemsGrid input{padding:12px 8px;font-size:18px;width:100%;border-radius:12px;border:1px solid #aaa;text-align:center;}
.itemsGrid .unit{font-size:15px;color:#666;}
.otherRow{display:flex;gap:10px;align-items:center;}
.otherRow input{flex:1;}
.btnGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.actionBtn{padding:18px;border:none;border-radius:16px;font-size:19px;font-weight:bold;color:white;}
.save{background:#2e9d45;}
.install{background:#ff9800;}
.clear{background:#e53935;}
.back{background:#888;grid-column:1/3;}
.savedMsg{display:none;background:#e8f8ec;color:#1b7d34;border:2px solid #2e9d45;border-radius:12px;padding:14px;text-align:center;font-size:18px;font-weight:bold;margin-bottom:16px;}
.actionBtn:active{transform:scale(.96);filter:brightness(.9);}
.actionBtn:disabled{opacity:.6;}
#acceptPop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center;}
#acceptPop.show{display:flex;}
#acceptPop .popBox{background:#fff;border-radius:20px;padding:30px 26px;text-align:center;max-width:320px;width:85%;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:popIn .25s ease;}
@keyframes popIn{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
#acceptPop .popIcon{font-size:56px;margin-bottom:8px;}
#acceptPop .popTitle{font-size:20px;font-weight:bold;color:#1b7d34;margin-bottom:6px;}
#acceptPop .popSub{font-size:14px;color:#555;line-height:1.5;}
.printOnly{display:none;}
.calLink{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0f766e;color:#fff;text-decoration:none;font-size:20px;font-weight:bold;padding:14px;border-radius:14px;margin:4px 0 6px;box-shadow:0 3px 10px rgba(15,118,110,.3);}
.calLink span{font-size:13px;font-weight:normal;opacity:.9;}
.calLink:active{transform:scale(.97);}
.pickCal{border:1px solid #cbd5e1;border-radius:14px;padding:10px;background:#fff;}
.pcHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.pcHead span{font-size:19px;font-weight:bold;}
.pcHead button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;width:48px;height:40px;font-size:18px;}
.pcGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.pcGrid .w{text-align:center;font-size:13px;font-weight:bold;color:#555;padding:2px 0;}
.pcGrid .w.su{color:#dc2626;} .pcGrid .w.sa{color:#1d4ed8;}
.pcGrid button{height:46px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;font-size:18px;font-weight:bold;color:#1f2937;}
.pcGrid button.su{color:#dc2626;} .pcGrid button.sa{color:#1d4ed8;}
.pcGrid button.past{opacity:.35;}
.pcGrid button.today{border:2px solid #f59e0b;}
.pcGrid button.sel{background:#1565c0;color:#fff;border-color:#1565c0;}
.pcGrid button.fix{background:#16a34a;color:#fff;border-color:#16a34a;}
.pcGrid .blank{height:46px;}
.candList{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.cand{display:flex;align-items:center;gap:8px;background:#f0f4f8;border:2px solid #ccc;border-radius:12px;padding:8px 10px;font-size:18px;font-weight:bold;}
.cand.fixed{background:#e7f1ff;border-color:#1565c0;color:#0b3d91;}
.cand .d{flex:1;}
.cand button{border:none;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:bold;cursor:pointer;}
.cand .fix{background:#fff;color:#1565c0;border:2px solid #1565c0;}
.cand.fixed .fix{background:#1565c0;color:#fff;}
.cand .rm{background:#fee2e2;color:#dc2626;}
.anger{display:inline-flex;flex-direction:column;gap:3px;padding:7px 12px;border-radius:12px;border:2px solid #e5e7eb;background:#fff;font-size:15px;font-weight:900;color:#374151;min-width:170px;}
.anger .bar{height:8px;border-radius:99px;background:#e5e7eb;overflow:hidden;}
.anger .bar i{display:block;height:100%;border-radius:99px;}
.anger.a1 .bar i{background:#22c55e;} .anger.a2 .bar i{background:#eab308;} .anger.a3 .bar i{background:#f97316;} .anger.a4 .bar i{background:#dc2626;}
.anger.a3{border-color:#d1d5db;color:#374151;}
.anger.max{background:#fff;}
.komatta{height:78px;width:auto;border-radius:12px;border:2px solid #e5e7eb;box-shadow:0 2px 6px rgba(0,0,0,.15);animation:komattaShake 1.4s infinite;vertical-align:middle;}
@keyframes komattaShake{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
.bombBtn{width:62px;height:62px;border-radius:50%;border:3px solid #111;background:radial-gradient(circle at 35% 35%,#666,#111);font-size:32px;cursor:pointer;animation:bombShake .5s infinite;box-shadow:0 0 0 4px rgba(220,38,38,.35);}
@keyframes bombShake{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg) scale(1.06);}}
#bombPop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;align-items:center;justify-content:center;}
#bombPop.show{display:flex;}
#bombPop .bx{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:340px;width:88%;}
#bombPop .boom{font-size:110px;line-height:1;animation:boom .6s ease-out;}
@keyframes boom{0%{transform:scale(.2);opacity:0;}60%{transform:scale(1.4);opacity:1;}100%{transform:scale(1);}}
#bombPop .t1{font-size:28px;font-weight:900;color:#dc2626;margin-top:6px;}
#bombPop .t2{font-size:16px;color:#333;margin-top:6px;line-height:1.6;}
#bombPop a,#bombPop button{display:block;width:100%;margin-top:12px;padding:14px;border-radius:12px;font-size:17px;font-weight:bold;border:none;text-decoration:none;}
#bombPop a{background:#dc2626;color:#fff;}
#bombPop button{background:#eee;color:#333;} .anger.a4{border-color:#d1d5db;color:#374151;}
/* カード:急ぎは左の枠、右に情報 */
.reqCard{display:flex;padding:0;overflow:hidden;}
.reqCard .cardMain{flex:1;min-width:0;padding:16px 18px;}
.urgSide{width:104px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;color:#fff;font-weight:900;text-align:center;}
.urgSide .ut{font-size:19px;letter-spacing:1px;line-height:1.2;}
.urgSide.noOni .ut{font-size:24px;}
.urgSide.u2{background:#dc2626;}
.urgSide.u2 .ut{animation:urgBlink 1s infinite;}
.urgSide.u1{background:#f59e0b;}
.urgSide.u0{background:#9333ea;}
.reqCard.urgent0,.reqCard.urgent1,.reqCard.urgent2{border-left:none;}
.reqCard.urgent2{background:#fff;}
.infoRows{margin:6px 0 4px;border-top:1px solid #e5e7eb;}
.infoRow{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:16px;line-height:1.5;}
.infoRow .k{flex-shrink:0;width:64px;color:#64748b;font-size:14px;font-weight:bold;padding-top:1px;}
.infoRow .v{flex:1;min-width:0;color:#1f2937;word-break:break-all;}
.infoRow .v.big{font-weight:bold;}
.infoRow .v a{color:#1d4ed8;font-weight:bold;text-decoration:none;}
.infoRow .v .free{display:block;background:#fffbeb;border-left:4px solid #f59e0b;padding:4px 8px;margin-top:4px;border-radius:4px;white-space:pre-wrap;}
@media(max-width:480px){.urgSide{width:76px;}.urgSide svg{width:52px;height:52px;}.urgSide .ut{font-size:15px;}.reqCard .cardMain{padding:12px;}.infoRow .k{width:52px;}}
.cardSetBtn{display:block;width:100%;border:none;background:#fff;color:#475569;border-radius:12px;padding:10px;font-size:15px;font-weight:bold;margin:0 0 6px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;}
#cardSetPop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2100;align-items:center;justify-content:center;padding:16px;}
#cardSetPop.show{display:flex;}
#cardSetPop .box2{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;}
#cardSetPop h3{font-size:18px;margin:0 0 4px;}
#cardSetPop .sub{font-size:13px;color:#64748b;margin-bottom:12px;}
#cardSetPop label{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:bold;padding:10px 12px;border:2px solid #e5e7eb;border-radius:12px;margin-bottom:8px;cursor:pointer;}
#cardSetPop label input{transform:scale(1.4);}
#cardSetPop .ok{width:100%;padding:14px;border:none;border-radius:12px;background:#1565c0;color:#fff;font-size:16px;font-weight:bold;margin-top:6px;}
/* 経過時間(24時間を超えたら黄黒のトラ柄) */
.callRow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;}
.callRow .callBtn{margin:0;}
.elapsed{display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:900;padding:10px 14px;border-radius:12px;background:#f1f5f9;color:#334155;border:2px solid #cbd5e1;}
.elapsed.tora{color:#111827;border-color:#6b7280;background:#fff;}
/* 現場確認希望・見積依頼(電話対応ボタンと同じ形。点滅はしない) */
.taskBtn{display:inline-block;border:none;font-size:17px;font-weight:bold;padding:12px 18px;border-radius:12px;cursor:pointer;}
.taskBtn:active{transform:scale(.95);}
.taskBtn.genba{background:#16a34a;color:#fff;box-shadow:0 3px 10px rgba(22,163,74,.35);}
.taskBtn.mitsu{background:#facc15;color:#422006;box-shadow:0 3px 10px rgba(202,138,4,.35);}
.taskBtn.done{background:#e8f8ec;color:#1b7d34;box-shadow:none;font-size:15px;padding:8px 14px;}
/* 鬼と早急対応 */
.oniPick{display:flex;gap:12px;margin-bottom:12px;}
.oniPick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid #ddd;border-radius:16px;padding:8px 4px;font-size:15px;font-weight:bold;color:#555;cursor:pointer;}
.oniPick button.selected{border-color:#1565c0;background:#e3f2fd;color:#1565c0;box-shadow:0 3px 10px rgba(21,101,192,.25);}
.urgBtnRow.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.urgBtnRow.three .urgBigBtn{font-size:21px;padding:22px 6px;letter-spacing:1px;}
.urgBigBtn.u0{border:3px solid #9333ea;background:#fff;color:#7e22ce;}
.urgBigBtn.u0.selected{background:#9333ea;color:#fff;box-shadow:0 4px 16px rgba(147,51,234,.5);transform:scale(1.03);}
.reqCard.urgent0{border-left:6px solid #9333ea;}
.urgBadge{display:flex;align-items:center;justify-content:center;gap:10px;}
.urgBadge.u0{background:#9333ea;color:#fff;box-shadow:0 3px 10px rgba(147,51,234,.4);}
.urgBadge span{white-space:nowrap;}
.urgBadge.u2{letter-spacing:1px;}
.urgBadge .oni{flex-shrink:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}
@media print{
body *{display:none !important;}
#printBox,#printBox *{display:block !important;}
body{background:white;padding-bottom:0;}
.box{box-shadow:none;border:1px solid #333;}
}
</style>
</head>
<body>
<header>
<button class="installIconBtn" id="installIconBtn" style="display:none;" onclick="installApp()">📲</button>
<h1>📞 電話依頼</h1>
<button class="gear" onclick="openSettings()">⚙️</button>
</header>
<div class="wrap">
<a class="calLink" href="calendar.html">📅 引取カレンダーを見る<span>回収予定日が入った依頼が自動で並びます</span></a>
<div id="reportArea"></div>

<div class="sectionLabel pending">🔴 未対応</div>
<div id="pendingList"></div>
<div class="sectionLabel doneLabel">✅ 対応済み</div>
<div id="doneList"></div>
</div>
<button class="fab" onclick="openSettings()">＋</button>

<!-- 爆弾 -->
<div id="bombPop" onclick="if(event.target===this)this.classList.remove('show')">
<div class="bx">
<div class="boom">💥</div>
<div class="t1">ドカーン！！</div>

// 事務所の怒り度:48時間で100%。急ぎほど早く上がる(大至急×2・至急×1.5・早急×1.2)
function angerHtml(item,el){
if(!el)return "";
const mul=item.urgency==="大至急"?2:item.urgency==="至急"?1.5:item.urgency==="早急対応"?1.2:1;
const pct=Math.min(180,Math.round(el.hours/48*100*mul));
const lv=pct<25?1:pct<50?2:pct<80?3:4;
const face=["","😊","😐","😠","😡"][lv];
return "<span class='anger a"+lv+(pct>=90?" max":"")+"'><span>"+face+" 事務所の怒り度 "+pct+"%</span><span class='bar'><i style='width:"+Math.max(pct/1.8,2)+"%'></i></span></span>"+
(pct>=50?"<img class='komatta' src='"+KOMATTA_IMG+"' alt='電話が鳴りやまない'>":"")+
(pct>=90?"<button class='bombBtn' title='押してみて' onclick=\"event.stopPropagation();bomb('"+item.id+"',"+pct+")\">💣</button>":"");
}
function bomb(id,pct){
const item=requestCache.find(function(r){return r.id===id;})||{};
document.getElementById("bombMsg").innerHTML="<b>"+escapeHtml(item.client||"")+" 様</b><br>事務所の怒り度 <b style='color:#dc2626'>"+pct+"%</b>！<br>もう待てません。今すぐ電話してください！";
const a=document.getElementById("bombCall");
if(item.phone){a.style.display="";a.href="tel:"+item.phone;a.textContent="☎ 今すぐ電話する("+item.phone+")";}else{a.style.display="none";}
const pop=document.getElementById("bombPop");
pop.classList.remove("show");void pop.offsetWidth;pop.classList.add("show");
}
function elapsedInfo(item){
const ms=createdMs(item);
if(ms===null)return null;
const h=Math.max(0,Math.floor((Date.now()-ms)/3600000));
const text="電話未対応 "+(h<1?"1時間以内":h+"時間経過");
return {hours:h,text:text,over:h>=24};
}
// 全角数字などを半角に(ひらがな入力のまま数字を打っても大丈夫なように)
function toHalfNum(s){
return String(s||"").normalize("NFKC").replace(/[ー－―]/g,"-").trim();
}
function numVal(id){
const n=parseInt(toHalfNum(document.getElementById(id).value).replace(/[^0-9]/g,""),10);
return isNaN(n)?0:n;
}

function todayStr(){
const d=new Date();
const y=d.getFullYear();
const m=String(d.getMonth()+1).padStart(2,"0");
const day=String(d.getDate()).padStart(2,"0");
return y+"-"+m+"-"+day;
}

function collectData(){

return {

oni:currentOni||"red",
requestDate:document.getElementById("requestDate").value,
client:client,
clientDept:document.getElementById("clientDept").value.trim(),
clientContact:document.getElementById("clientContact").value.trim(),
staff:staff,
phone:toHalfNum(document.getElementById("phone").value),
contents:contents,
contentsFree:document.getElementById("contentsFree").value.trim(),
cardFields:getCardFieldChecks(),
responseText:document.getElementById("responseText").value.trim(),
pickupDate:(function(){const pa=document.getElementById("pickupAddDate").value;const pd=document.getElementById("pickupDate").value;
// 候補に追加し忘れた日付が1つだけ入っていたら、それを決定日として扱う
if(!pd&&!pickupCands.length&&pa){pickupCands.push(pa);return pa;}return pd;})(),
pickupCandidates:pickupCands.slice().sort(),

ampm:ampmEl?ampmEl.value:"",

holeDrum:numVal("itemHoleDrum"),

}
};
}

function validate(data){
if(!data.client){alert("引取先を入力してください");return false;}
if(!data.staff||data.staff==="未選択"){alert("電話受付者を選んでください");return false;}
return true;
}

function itemsSummaryText(items){
const parts=[];
if(items.holeDrum>0)parts.push("穴ありドラム缶 "+items.holeDrum+"本");
if(items.noHoleDrum>0)parts.push("穴なしドラム缶 "+items.noHoleDrum+"本");
if(items.flexBag>0)parts.push("フレコン "+items.flexBag+"枚");
if(items.box>0)parts.push("箱 "+items.box+"個");
if(items.other)parts.push("その他："+items.other);
return parts.length?parts.join("、"):"なし";
}

function escapeHtml(s){
return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildSummaryLines(data){
// 緊急度・対応メモは先頭・末尾に追加される(下のreturn配列参照)
const lines=[];
if(data.urgency && data.urgency!=="通常")lines.push((data.urgency==="大至急"?"🚨":data.urgency==="至急"?"🔥":"👹")+"緊急度："+data.urgency);
if(data.requestDate)lines.push("依頼日："+data.requestDate);
lines.push("引取先："+data.client);
if(data.clientDept)lines.push("取引先部署："+data.clientDept);
if(data.clientContact)lines.push("担当者名："+data.clientContact);
if(data.phone)lines.push("電話番号："+data.phone);
lines.push("電話受付者："+data.staff);
if(data.contents && data.contents.length)lines.push("依頼内容："+data.contents.join("、"));
if(data.contentsFree)lines.push("依頼メモ："+data.contentsFree);
if(data.responseText)lines.push("対応内容："+data.responseText);
if(pickupText(data))lines.push("回収予定日："+pickupText(data));
if(data.pickupNote)lines.push("回収メモ："+data.pickupNote);
if(data.calledAtText)lines.push("📞電話済み："+data.calledAtText);
if(data.genbaAtText)lines.push("🔍現場確認済み："+data.genbaAtText);
if(data.mitsuAtText)lines.push("📝見積済み："+data.mitsuAtText);
if(data.doneAtText)lines.push("✅対応済み："+data.doneAtText+(data.doneMemo?"（"+data.doneMemo+"）":""));
const itemsText=itemsSummaryText(data.items||{});
if(itemsText!=="なし")lines.push("持ち物："+itemsText);
return lines;
}

function contentPreview(data){
if(data.contents && data.contents.length)return data.contents.join("、");
if(data.contentsFree)return data.contentsFree;
if(data.responseText)return data.responseText;
return "（内容なし）";
}

// ==== 回収予定日(希望日の候補と決定) ====
let pickupCands=[];
// 押して選ぶミニカレンダー
let pcY=new Date().getFullYear(), pcM=new Date().getMonth();
function pcMove(n){pcM+=n;if(pcM<0){pcM=11;pcY--;}if(pcM>11){pcM=0;pcY++;}renderPickCal();}
function pcYmd(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function renderPickCal(){
document.getElementById("pcTitle").textContent=pcY+"年"+(pcM+1)+"月";
const first=new Date(pcY,pcM,1).getDay(), last=new Date(pcY,pcM+1,0).getDate();
const fixed=document.getElementById("pickupDate").value, today=todayStr();
let h=["日","月","火","水","木","金","土"].map(function(w,i){return "<div class='w"+(i===0?" su":i===6?" sa":"")+"'>"+w+"</div>";}).join("");
for(let i=0;i<first;i++)h+="<div class='blank'></div>";
for(let d=1;d<=last;d++){
const ds=pcYmd(pcY,pcM,d), wd=(first+d-1)%7;
const c=[wd===0?"su":wd===6?"sa":"", ds<today?"past":"", ds===today?"today":"", ds===fixed?"fix":(pickupCands.indexOf(ds)!==-1?"sel":"")].filter(Boolean).join(" ");
h+="<button type='button' class='"+c+"' onclick=\"togglePickDay('"+ds+"')\">"+d+"</button>";
}
document.getElementById("pcGrid").innerHTML=h;
}
function togglePickDay(ds){
if(pickupCands.indexOf(ds)!==-1)removePickupCand(ds);
else{pickupCands.push(ds);renderPickupCands();}
}
function renderPickupCands(){
const fixed=document.getElementById("pickupDate").value;
pickupCands.sort();
document.getElementById("pickupCandList").innerHTML=pickupCands.map(function(d){
const on=d===fixed;
return "<div class='cand"+(on?" fixed":"")+"'><span class='d'>"+(on?"✅ ":"")+escapeHtml(fmtPickup(d))+(on?" 決定":" 希望")+"</span>"+
"<button type='button' class='fix' onclick=\"fixPickup('"+d+"')\">"+(on?"決定を外す":"この日に決定")+"</button>"+
"<button type='button' class='rm' onclick=\"removePickupCand('"+d+"')\">✕</button></div>";
}).join("");
renderPickCal();
}
function addPickupCand(){
const d=document.getElementById("pickupAddDate").value;
if(!d){alert("日付を選んでください");return;}
if(pickupCands.indexOf(d)===-1)pickupCands.push(d);
document.getElementById("pickupAddDate").value="";
renderPickupCands();
}
function removePickupCand(d){
pickupCands=pickupCands.filter(function(x){return x!==d;});
const pd=document.getElementById("pickupDate");
if(pd.value===d)pd.value="";
renderPickupCands();
}
function fixPickup(d){
const el=document.getElementById("pickupDate");
el.value=(el.value===d)?"":d;
renderPickupCands();
}
function setPickupForm(item){
pickupCands=(item&&Array.isArray(item.pickupCandidates))?item.pickupCandidates.slice():[];
const fixed=(item&&item.pickupDate)||"";
if(fixed&&pickupCands.indexOf(fixed)===-1)pickupCands.push(fixed);
document.getElementById("pickupDate").value=fixed;
document.getElementById("pickupNote").value=(item&&item.pickupNote)||"";
document.getElementById("pickupAddDate").value="";
const base=fixed||pickupCands.slice().sort()[0];
if(base){pcY=Number(base.slice(0,4));pcM=Number(base.slice(5,7))-1;}else{pcY=new Date().getFullYear();pcM=new Date().getMonth();}
renderPickupCands();
}
function pickupText(item){
if(item.pickupDate)return fmtPickup(item.pickupDate)+(item.ampm?" "+item.ampm:"")+" 決定";
const c=(item.pickupCandidates||[]).slice().sort();
return c.length?"希望 "+c.map(fmtPickup).join("・")+(item.ampm?"("+item.ampm+")":""):"";
}

function renderLists(){
renderReports();
const pendingBox=document.getElementById("pendingList");
const doneBox=document.getElementById("doneList");
const callPending=function(r){return (r.contents||[]).indexOf("電話欲しい")!==-1 && !r.calledAtText;};
const urgRank=function(r){return r.urgency==="大至急"?0:r.urgency==="至急"?1:r.urgency==="早急対応"?2:callPending(r)?3:4;};
const todayPrefix=(new Date().getMonth()+1)+"/"+new Date().getDate()+" ";
const doneToday=function(r){return r.status==="対応済み" && (r.doneAtText||"").indexOf(todayPrefix)===0;};
const pendingOnly=requestCache.filter(function(r){return r.status!=="対応済み";})
.sort(function(a,b){
if(urgRank(a)!==urgRank(b))return urgRank(a)-urgRank(b);
// 同じ段の中では、電話がまだのものを上に。電話待ちどうしは待たせている時間が長い順
if(callPending(a)!==callPending(b))return callPending(a)?-1:1;
if(callPending(a))return (createdMs(a)||0)-(createdMs(b)||0);
return (b.requestDate||"").localeCompare(a.requestDate||"");
});
// 今日対応済みにしたものは、当日中はメインの一覧の下に残す
const doneTodayList=requestCache.filter(doneToday)
.sort(function(a,b){return (b.doneAtText||"").localeCompare(a.doneAtText||"");});
const pending=pendingOnly.concat(doneTodayList);
const done=requestCache.filter(function(r){return r.status==="対応済み" && !doneToday(r);})
.sort(function(a,b){return (b.requestDate||"").localeCompare(a.requestDate||"");});
if(pending.length===0){
pendingBox.innerHTML="<div class='empty'>未対応の依頼はありません</div>";
}else{
pendingBox.innerHTML=pending.map(renderCard).join("");
}
if(done.length===0){
doneBox.innerHTML="<div class='empty'>対応済みの依頼はありません</div>";
}else{
doneBox.innerHTML=done.map(renderCard).join("");
}
}

function fmtPickup(dateStr){
const d=new Date(dateStr+"T00:00:00");
if(isNaN(d))return dateStr;
const w=["日","月","火","水","木","金","土"][d.getDay()];
return (d.getMonth()+1)+"/"+d.getDate()+"("+w+")";
}

function printDetail(id){
const item=requestCache.find(function(r){return r.id===id;});
if(!item)return;
fillPrintBox(item);
window.print();
}

function exportDetailPdf(id){
const item=requestCache.find(function(r){return r.id===id;});
if(!item)return;
fillPrintBox(item);
const printBox=document.getElementById("printBox");
const prevDisplay=printBox.style.display;
printBox.style.display="block";
html2canvas(printBox,{scale:2,backgroundColor:"#ffffff"}).then(function(canvas){
printBox.style.display=prevDisplay;
const {jsPDF}=window.jspdf;
const doc=new jsPDF("p","mm","a4");
const pageWidth=doc.internal.pageSize.getWidth();
const imgWidth=pageWidth-20;
const imgHeight=canvas.height*imgWidth/canvas.width;
const imgData=canvas.toDataURL("image/png");
doc.addImage(imgData,"PNG",10,10,imgWidth,imgHeight);
const fileName="電話依頼_"+(item.client||"未記入")+"_"+(item.requestDate||todayStr())+".pdf";
doc.save(fileName);
}).catch(function(){
printBox.style.display=prevDisplay;
alert("PDFの作成に失敗しました。");
});
}

// ==== 設定（入力フォーム）画面の開閉 ====
function openSettings(){
document.getElementById("settingsScreen").classList.add("show");
if(!document.getElementById("requestDate").value){
document.getElementById("requestDate").value=todayStr();
}
}

function cancelEditMode(){
if(editingRequestId){
editingRequestId=null;
document.querySelector("#settingsScreen .setHeader h2").textContent="新しい依頼を入力";
clearForm();
}
}
function closeSettings(){
document.getElementById("settingsScreen").classList.remove("show");
cancelEditMode();
}

// ==== PWAインストール ====
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
e.preventDefault();
deferredPrompt=e;
const btn=document.getElementById("installBtn");
if(btn)btn.style.display="block";
const iconBtn=document.getElementById("installIconBtn");
if(iconBtn)iconBtn.style.display="block";
});

function installApp(){
if(!deferredPrompt)return;
deferredPrompt.prompt();
deferredPrompt.userChoice.then(function(){
deferredPrompt=null;
const btn=document.getElementById("installBtn");
if(btn)btn.style.display="none";
const iconBtn=document.getElementById("installIconBtn");
if(iconBtn)iconBtn.style.display="none";
});
}

window.addEventListener("appinstalled",function(){
const btn=document.getElementById("installBtn");
if(btn)btn.style.display="none";
const iconBtn=document.getElementById("installIconBtn");
if(iconBtn)iconBtn.style.display="none";
});

document.addEventListener("DOMContentLoaded",function(){
loadStaff();
buildCardFieldGroup();
setPickupForm(null);
document.getElementById("oniPickRed").innerHTML=oniSvg("red",80);
document.getElementById("oniPickBlue").innerHTML=oniSvg("blue",80);
setOni("red");
loadRequests();
// 経過時間を1分ごとに更新
setInterval(function(){if(requestCache.length)renderLists();},60000);
if(window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone){
const btn=document.getElementById("installBtn");
if(btn)btn.style.display="none";
const iconBtn=document.getElementById("installIconBtn");
if(iconBtn)iconBtn.style.display="none";
}
});

if("serviceWorker" in navigator){
window.addEventListener("load",function(){
navigator.serviceWorker.register("service-worker.js").catch(function(){});
});
}
</script>
